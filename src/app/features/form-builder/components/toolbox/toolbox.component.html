<div class="p-4 bg-white border-r border-gray-200 h-full overflow-y-auto shadow-sm">
  <h3 class="font-bold text-lg mb-4 text-gray-800 border-b pb-2">Toolbox</h3>
  
  <div 
    class="flex flex-col gap-4"
    cdkDropList 
    [cdkDropListConnectedTo]="state.connectedDropLists()"
    cdkDropListSortingDisabled
  >
    <!-- Layout Containers -->
    <div>
      <div class="text-xs font-bold text-[#484d56] uppercase tracking-wider mb-2">Layout Containers</div>
      <div class="grid grid-cols-2 gap-2">
        @for (item of containerItems; track item.type) {
          <div 
            class="p-2.5 border rounded-lg shadow-2xs bg-indigo-50/50 border-indigo-100 cursor-move hover:border-indigo-400 hover:text-indigo-600 transition-all flex flex-col items-center justify-center text-center gap-1 group"
            cdkDrag 
            [cdkDragData]="item.type"
          >
            <span class="text-xl group-hover:scale-110 transition-transform">{{ item.icon }}</span>
            <span class="text-xs font-medium">{{ item.label }}</span>
            <div *cdkDragPreview class="p-3 border rounded shadow-lg bg-indigo-50 opacity-90 w-48 flex items-center gap-2">
              <span class="text-xl">{{ item.icon }}</span>
              <span class="font-medium text-xs">{{ item.label }}</span>
            </div>
          </div>
        }
      </div>
    </div>

    <!-- Standard Fields -->
    <div>
      <div class="text-xs font-bold text-[#484d56] uppercase tracking-wider mb-2">Form Controls</div>
      <div class="flex flex-col gap-2">
        @for (item of fieldItems; track item.type) {
          <div 
            class="p-2.5 border rounded-lg shadow-2xs bg-white cursor-move hover:border-blue-400 hover:text-blue-600 transition-all flex items-center gap-2.5"
            cdkDrag 
            [cdkDragData]="item.type"
          >
            <span class="text-lg">{{ item.icon }}</span>
            <span class="text-xs font-medium">{{ item.label }}</span>
            <div *cdkDragPreview class="p-3 border rounded shadow-lg bg-blue-50 opacity-90 w-48 flex items-center gap-2">
              <span class="text-lg">{{ item.icon }}</span>
              <span class="font-medium text-xs">{{ item.label }}</span>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
